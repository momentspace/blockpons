name: Flutter checks and preview builds

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true
      - name: Create Flutter platform skeletons
        run: flutter create . --project-name blockpons --platforms=web,android,ios --no-pub
      - name: Resolve packages
        run: flutter pub get
      - name: Dart formatting
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build web preview
        run: flutter build web --release
      - name: Build unsigned debug Android APK
        run: flutter build apk --debug
      - name: Upload web preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blockpons-web
          path: build/web/
          retention-days: 7
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blockpons-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
